- insert:
    - id: memorydreaming-plugin
      name: '@local/memorydreaming'
      config:
        enabled: true
        # For isolated installation, run scripts/install.py before importing the plugin.
        pythonCommand: python
        userId: u1
        characterId: c1
        relationshipId: r1
        domain: real
        maxTokens: 1200
        # 请求总预算优先读取供应商元数据；以下是额外预留，不能扩大模型窗口。
        safetyMargin: 512
        requestOverhead: 64
        bridgeTimeoutMs: 15000
        bridgeShutdownMs: 2000
        bridgeMaxPending: 64
        autoPrefetch: true

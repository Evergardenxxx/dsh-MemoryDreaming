- insert:
    - id: memorydreaming-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: memorydreaming
        transport: stdio
        command: 'C:\Python314\python.exe'
        args:
          - '-X'
          - utf8
          - '-m'
          - memorydreaming
          - '--db'
          - 'D:\My_project\MemoryDreaming\.memorydreaming\deepseek-harness.db'
          - mcp
          - '--user'
          - u1
          - '--character'
          - c1
          - '--relationship'
          - r1
        cwd: 'D:\My_project\MemoryDreaming'
        toolCallTimeoutMs: 60000
        failOnStartupError: true
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10

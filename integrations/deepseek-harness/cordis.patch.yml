- insert:
    - id: memorydreaming-plugin
      name: '@local/memorydreaming'
      config:
        enabled: true
        pythonCommand: 'C:\Python314\python.exe'
        repoPath: 'D:\My_project\MemoryDreaming'
        dbPath: 'D:\My_project\MemoryDreaming\.memorydreaming\deepseek-harness.db'
        userId: u1
        characterId: c1
        relationshipId: r1
        domain: real
        maxTokens: 1200
        # 请求总预算优先读取供应商元数据；以下是额外预留，不能扩大模型窗口。
        safetyMargin: 512
        requestOverhead: 64

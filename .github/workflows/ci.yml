name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install --editable .
      - name: Compile
        run: |
          python -m compileall -q memorydreaming tests
          node --check integrations/deepseek-harness/lib/index.js
          node --check integrations/deepseek-harness/lib/request-budget.js
      - name: Test
        run: python -m unittest discover -s tests -q
      - name: Build package
        run: python -m pip wheel --no-deps --wheel-dir dist .

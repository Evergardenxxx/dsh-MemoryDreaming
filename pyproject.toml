# 项目元信息与打包配置。
# 第一版刻意不引入任何第三方运行时依赖：只用 Python 标准库 + SQLite。
# 这样新手 clone 下来就能直接 `python -m memorydreaming demo` 跑通，不用先装环境。

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memorydreaming"
version = "0.30.0"
description = "面向长期陪伴角色的持久记忆引擎：身份、关系、共同经历可跨窗口恢复"
keywords = ["long-term-memory", "deepseek", "ai-agents", "sqlite", "roleplay"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
readme = "README.md"
requires-python = ">=3.10"          # 用到了 X | None 这种新式类型标注
dependencies = []                    # 刻意留空，见文件顶部注释
license = { text = "MIT" }

[project.urls]
Homepage = "https://github.com/Evergardenxxx/dsh-MemoryDreaming"
Repository = "https://github.com/Evergardenxxx/dsh-MemoryDreaming.git"
Documentation = "https://github.com/Evergardenxxx/dsh-MemoryDreaming/blob/main/docs/README.md"
Issues = "https://github.com/Evergardenxxx/dsh-MemoryDreaming/issues"
Changelog = "https://github.com/Evergardenxxx/dsh-MemoryDreaming/blob/main/CHANGELOG.md"

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.4,<6"]
tokenizer = ["tokenizers>=0.21,<1", "jinja2>=3.1,<4"]

[project.scripts]
# 安装后可以直接在命令行敲 memorydreaming，效果等同 python -m memorydreaming
memorydreaming = "memorydreaming.cli:main"

[tool.setuptools]
packages = ["memorydreaming", "memorydreaming.storage", "memorydreaming.retrieval", "memorydreaming.services"]

[tool.setuptools.package-data]
# schema.sql 是运行时读取的建表脚本，必须跟着包一起安装
memorydreaming = ["storage/*.sql", "llm-tools.json", "data/*.json"]
